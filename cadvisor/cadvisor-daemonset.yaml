apiVersion: v1
kind: ServiceAccount
metadata:
  name: cadvisor
  namespace: povsim
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: povsim
  labels:
    app.kubernetes.io/name: cadvisor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cadvisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadvisor
      annotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portNumber: "8080"
    spec:
      serviceAccountName: cadvisor
      automountServiceAccountToken: false
      hostNetwork: true
      hostPID: true
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.49.1
          args:
            - --housekeeping_interval=10s
            - --max_housekeeping_interval=15s
            - --event_storage_event_limit=default=0
            - --event_storage_age_limit=default=0
            - --enable_metrics=cpu,memory,network,disk,diskIO,process
            - --store_container_labels=false
            - --whitelisted_container_labels=io.kubernetes.container.name,io.kubernetes.pod.name,io.kubernetes.pod.namespace
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 300m
              memory: 300Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            - name: var-run
              mountPath: /var/run
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: docker
              mountPath: /var/lib/docker
              readOnly: true
            - name: disk
              mountPath: /dev/disk
              readOnly: true
      volumes:
        - name: rootfs
          hostPath: { path: / }
        - name: var-run
          hostPath: { path: /var/run }
        - name: sys
          hostPath: { path: /sys }
        - name: docker
          hostPath: { path: /var/lib/docker }
        - name: disk
          hostPath: { path: /dev/disk }
