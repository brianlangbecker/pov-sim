cluster:
  name: orbstack
destinations:
  # Single OTLP gateway destination for metrics, logs, and traces.
  # Profiles cannot go through OTLP (Pyroscope ingest is a separate
  # protocol), so they have their own destination below.
  grafana-cloud-otlp:
    type: otlp
    url: https://otlp-gateway-us-central2.grafana.net/otlp
    protocol: http
    auth:
      type: basic
      username: "${GRAFANA_STACK_ID}"
      password: "${GRAFANA_CLOUD_TOKEN}"
    metrics:
      enabled: true
    logs:
      enabled: true
    traces:
      enabled: true
    # Fallback resource attribute: stamp env=production only on telemetry
    # that didn't already declare it. Apps (airlines, flights) set env at
    # their source via OTEL_RESOURCE_ATTRIBUTES; this catches everything
    # else — cluster-scoped signals produced by Alloy itself (kubelet /
    # cAdvisor / kube-state-metrics scrapes, pod stdout logs via filelog,
    # node journal logs, cluster events) which have no upstream env var.
    #
    # `where attributes["env"] == nil` makes this an insert, not an
    # overwrite, so app-declared values (e.g. env=staging in a future dev
    # cluster) always win.
    processors:
      transform:
        metrics:
          resource:
            - 'set(attributes["env"], "production") where attributes["env"] == nil'
        logs:
          resource:
            - 'set(attributes["env"], "production") where attributes["env"] == nil'
          # Pod logs arrive as OTel records whose body is the raw JSON line the
          # apps write to stdout (airlines: logstash-logback-encoder; flights:
          # python-json-logger). Parse that JSON and lift the logger field into
          # a log-record attribute — Loki then stores it as structured metadata
          # automatically. airlines emits "logger_name", flights emits "name".
          # Guards: the `^\{` check skips non-JSON logs (nginx, alloy, etc.) so
          # ParseJSON never runs on them, and the key-presence check avoids
          # OTTL's "key not found in map" error when the field is absent
          # (indexing a missing map key throws rather than returning nil).
          log:
            - 'set(attributes["logger_name"], ParseJSON(body)["logger_name"]) where IsMatch(body, "^\\{") and IsMatch(body, "\"logger_name\"\\s*:")'
            - 'set(attributes["logger_name"], ParseJSON(body)["name"]) where attributes["logger_name"] == nil and IsMatch(body, "^\\{") and IsMatch(body, "\"name\"\\s*:")'
        traces:
          resource:
            - 'set(attributes["env"], "production") where attributes["env"] == nil'
  grafana-cloud-profiles:
    type: pyroscope
    url: https://profiles-prod-026.grafana.net:443
    auth:
      type: basic
      username: "${GRAFANA_STACK_ID}"
      password: "${GRAFANA_CLOUD_TOKEN}"
    # Pyroscope uses Loki-style labels, not OTel attributes, so tag
    # profiles at the destination the same way we tag OTLP signals above.
    extraLabels:
      env: production
clusterMetrics:
  enabled: true
  collector: alloy-metrics
  kubelet:
    enabled: true
  cadvisor:
    enabled: true
    metricsTuning:
      useDefaultAllowList: true
      includeMetrics:
        - container_cpu_usage_seconds_total
        - container_memory_usage_bytes
        - container_memory_working_set_bytes
        - container_memory_rss
        - container_spec_cpu_quota
        - container_spec_cpu_period
        - container_fs_reads_bytes_total
        - container_fs_writes_bytes_total
        - container_network_receive_bytes_total
        - container_network_transmit_bytes_total
hostMetrics:
  enabled: true
  collector: alloy-metrics
  linuxHosts:
    enabled: true
  energyMetrics:
    enabled: true
annotationAutodiscovery:
  enabled: true
  collector: alloy-metrics
prometheusOperatorObjects:
  enabled: true
  collector: alloy-metrics
clusterEvents:
  enabled: true
  collector: alloy-singleton
nodeLogs:
  enabled: true
  collector: alloy-logs
podLogsViaOpenTelemetry:
  enabled: true
  collector: alloy-logs
applicationObservability:
  enabled: true
  collector: alloy-receiver
  receivers:
    otlp:
      grpc:
        enabled: true
        port: 4317
      http:
        enabled: true
        port: 4318
    zipkin:
      enabled: true
      port: 9411
# Beyla eBPF auto-instrumentation is enabled to demonstrate zero-code
# observability for un-instrumented workloads. It's suppressed for the
# three services in this repo (airlines, flights, frontend) because they
# already have first-party OTel instrumentation (Java agent, Python distro,
# Faro Web SDK) — Beyla-inferred RED metrics for those three were showing
# up in App Observability as duplicate services (`flights` alongside
# `povsim/flights`, etc.) because Beyla doesn't stamp service.namespace.
#
# `deliverTracesToApplicationObservability: false` keeps Beyla's traces
# out of App O11y (agent-emitted traces are the source of truth).
# `extraMetricProcessingRules` drops Beyla's RED metrics for these specific
# services post-scrape, so the App O11y "Services" list stays clean.
autoInstrumentation:
  enabled: true
  collector: alloy-metrics
  beyla:
    deliverTracesToApplicationObservability: false
    extraMetricProcessingRules: |-
      rule {
        source_labels = ["service_name"]
        regex = "airlines|flights|frontend"
        action = "drop"
      }
profiling:
  enabled: true
  collector: alloy-profiles
  ebpf:
    enabled: true
collectors:
  alloy-metrics:
    presets:
      - clustered
      - statefulset
  alloy-singleton:
    presets:
      - singleton
  alloy-logs:
    presets:
      - filesystem-log-reader
      - daemonset
    # podLogsViaOpenTelemetry is public-preview in k8s-monitoring v4.x; the
    # collector refuses to load the OTel log-source components without this.
    alloy:
      stabilityLevel: public-preview
  alloy-receiver:
    presets:
      - deployment
  alloy-profiles:
    presets:
      - privileged
      - daemonset
collectorCommon:
  alloy:
    remoteConfig:
      enabled: true
      url: https://fleet-management-prod-002.grafana.net
      auth:
        type: basic
        username: "${GRAFANA_STACK_ID}"
        password: "${GRAFANA_CLOUD_TOKEN}"
# opencost is disabled in the OTLP-only variant because OpenCost reads
# from a Prometheus-compatible endpoint, and the OTLP gateway is
# write-only. To get cost metrics, use povsim-k8s-monitoring-values-nonotlp.yaml.
#
# windows-exporter is dropped because OrbStack only runs Linux nodes.
#
# podLogsViaLoki (Loki-native push path) is replaced by
# podLogsViaOpenTelemetry so that pod logs route to the OTLP destination
# as OTel log records instead of trying to find a Loki destination that
# no longer exists. That feature is public-preview in v4.x, which is
# why alloy-logs sets alloy.stabilityLevel: public-preview above.
#
# costMetrics is omitted for the same reason as opencost: it relies on
# Prometheus reads that the OTLP gateway doesn't support.
telemetryServices:
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true
  kepler:
    deploy: true
