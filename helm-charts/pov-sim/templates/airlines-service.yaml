apiVersion: v1
kind: Service
metadata:
  name: airlines
  namespace: povsim
  labels:
    app: airlines
    {{- include "pov-sim.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: airlines
  ports:
    - port: {{ .Values.airlines.port }}
      targetPort: {{ .Values.airlines.port }}
