apiVersion: apps/v1
kind: Deployment
metadata:
  name: flights
  namespace: povsim
  labels:
    app: flights
    {{- include "pov-sim.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.flights.replicas }}
  selector:
    matchLabels:
      app: flights
  template:
    metadata:
      labels:
        app: flights
    spec:
      containers:
        - name: flights
          image: "{{ .Values.flights.image.repository }}:{{ .Values.flights.image.tag }}"
          imagePullPolicy: {{ .Values.flights.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.flights.port }}
          env:
            - name: PYROSCOPE_APPLICATION_NAME
              value: flights
            - name: PYROSCOPE_SERVER_ADDRESS
              value: https://profiles-prod-026.grafana.net:443
            - name: PYROSCOPE_BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-profiles-grafana-k8s-monitoring
                  key: username
            - name: PYROSCOPE_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-profiles-grafana-k8s-monitoring
                  key: password
