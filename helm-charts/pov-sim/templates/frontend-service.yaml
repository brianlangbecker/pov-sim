apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: povsim
  labels:
    app: frontend
    {{- include "pov-sim.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
